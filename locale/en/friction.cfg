[entity-description]
quartz-ore=Raw quartz ore. Primary source of silicon for electronics.
tin-ore=Raw tin ore. Used for solder, bronze alloy and protective coatings.
gold-ore=Raw gold ore. Essential for electronic contacts and circuit board plating.
nickel-ore=Raw nickel ore. Used for alloys, stainless steel and protective coatings.
lead-ore=Raw lead ore. Used for batteries and radiation shielding. Always found near zinc deposits.
zinc-ore=Raw zinc ore. Used for galvanization and brass alloy. Always found near lead deposits.
crusher=A coal-powered machine that crushes raw ore into a finer form, improving smelting efficiency.
