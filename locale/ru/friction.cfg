[entity-description]
quartz-ore=Сырая кварцевая руда. Основной источник кремния для электроники.
tin-ore=Сырая оловянная руда. Используется для припоя, бронзы и защитных покрытий.
gold-ore=Сырая золотая руда. Необходима для электрических контактов и покрытия печатных плат.
nickel-ore=Сырая никелевая руда. Используется для сплавов, нержавеющей стали и покрытий.
lead-ore=Сырая свинцовая руда. Используется для аккумуляторов и радиационной защиты. Всегда залегает рядом с цинком.
zinc-ore=Сырая цинковая руда. Используется для оцинковки и латуни. Всегда залегает рядом со свинцом.
